name: Build Debug APK

on:
  push:
    branches:
      - test/debug-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build full debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate runtime configuration
        run: |
          cat > local.properties <<'EOF'
          INTRODB_API_URL=https://api.introdb.app/
          EOF

      - name: Build full debug APK
        run: ./gradlew :composeApp:assembleFullDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-apk
          path: composeApp/build/outputs/apk/full/debug/composeApp-full-debug.apk
          if-no-files-found: error
